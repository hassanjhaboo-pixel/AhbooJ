<html lang="en"><head><meta charset="utf-8"><title>Bisou breakfast reel</title>
<style>

</style></head><body><canvas id="c"></canvas>
<script>
// Bisou, new breakfast menu. One unbroken overhead take on their woven placemat. Five plates lie along the table;

const DISHES = [

// every beat lives here. arrive = plate centred at full size; push = end of its lean-in (the whip to the next starts there)

const WT = document.createElement('canvas');
const LT = document.createElement('canvas'); LT.width = cv.width; LT.height = cv.height; const lctx = LT.getContext('2d'); lctx.imageSmoothingQuality = 'high';

let I = {}, G, LADS, MAT, MATH, PARTS, cam, PLATE_R = 470, GAP = 1500, SHADOW = {}, PUFF, SCN = null, LIFT = 130;
const plateY = i => i * GAP;
const ks = d => PLATE_R / G.dish[d.k].plate[2];                       // hero px -> world
const world = (d, i, px, py) => { const p = G.dish[d.k].plate; return [540 + (px - p[0]) * ks(d), plateY(i) + (py - p[1]) * ks(d)]; };
const toScreen = (c, x, y) => [(x - c.cx) * c.z + 540, (y - c.cy) * c.z + 960];

function buildCamera() {

// ---------- the table ----------
function table(c) {

// ---------- a plate, with its close-ups taking over as the camera gets near ----------
function plate(c, d, i, t, imgKey = null, alpha = 1) {

// ---------- little life: steam off the hot dishes, sugar on the pancakes ----------

  const [fx, fy] = toScreen(c, d.fx, d.fy); ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (let j = 0; j < 7; j++) for (let n = 0; n < 9; n++) { const life = ((t * 0.32 + j * 0.143 + n * 0.11) % 1), x = fx + (j - 3) * 46 * c.z ** 0.6 + Math.sin(t * 1.3 + j * 2 + life * 5) * 40 * life * c.z ** 0.6,

}

// ---------- type ----------

  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `${weight} ${size}px Nun, sans-serif`; ctx.letterSpacing = track + 'px'; ctx.textAlign = align; const w = ctx.measureText(str).width, x0 = align === 'center' ? x - w / 2 : x;
  ctx.beginPath(); ctx.rect(x0 - 20, y - size * 1.05, w + 40, size * 1.4); ctx.clip(); ctx.fillStyle = col; ctx.fillText(str, x, y + (1 - e) * size * 1.4 - o * size * 1.4); ctx.restore();
}
function slabLabel(d, t, tin, tout) {   // full-width slab in the dish's own colour, under the plate; type rises out of it

  ctx.font = `900 ${size}px Nun, sans-serif`; ctx.fillStyle = CREAM; ctx.textBaseline = 'alphabetic';

}
// ---------- the mark: the plate rim becomes the O, then the letters, rail and utensils ----------

function ring(c, t) {   // the empty plate's rim shrinks and slides into the O

// ---------- intro: their mark presents; JUST ADDED in letters cut from the food; then the camera dives through the O ----------
const CARD = { x: 540, y: 400, s: 0.92 };              // where the mark rests on the title card (viewBox -> screen)
const OC = () => markPt(G.O[0], G.O[1], CARD);
const INNER = 0.74;                                     // inner hole of the O as a share of its outer radii
function foodWord(str, dish, y, t, tin, drift) {       // a word whose letters are filled with a dish, slammed up out of a mask

function introCard(t) {   // everything on the title card, drawn in card space

function intro(t) {
