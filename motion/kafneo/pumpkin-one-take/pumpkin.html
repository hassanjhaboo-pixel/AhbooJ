<html lang="en"><head><meta charset="utf-8"><title>Kafneo iced pumpkin spice v3</title>

  ctx.save(); if (soft > 0.3) ctx.filter = `blur(${soft.toFixed(1)}px)`; ctx.drawImage(TMP, x - w / 2, y - h + 6 * s, w, h); ctx.restore();

// ---------- leaves: they fall from the trees on one wind; some land on the table and stay ----------
const LEAVES = [];   // built at load: { img, depth, x0, t0, dur, land }
function leaves(c, t) { LEAVES.forEach(L => { const u = (t - L.t0) / L.dur; if (u < 0) return; const p = L.land ? Math.min(1, u) : u % 1;

function note(str, t, tin, tout, y) { if (t < tin || t > tout + 0.4) return; const e = snap(prog(t, tin, tin + 0.5)); ctx.save(); ctx.font = '500 40px Pop, sans-serif'; const w = ctx.measureText(str).width; ctx.restore();
