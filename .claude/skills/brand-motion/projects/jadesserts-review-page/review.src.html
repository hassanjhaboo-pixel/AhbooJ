<style>
/* Layout: one narrow game screen — a pixel stage with Cherry & Bomb, their dialogue box, then the current quest step on parchment. */
:root {
  --ink: #4a2236;          /* plum outline, the line colour of every sprite */
  --cream: #fff4dc;        /* parchment */
  --paper: #fffaf0;
  --pink: #f4636f;         /* Jadesserts pink */
  --pink-deep: #dd4652;
  --blush: #ffd9df;
  --gingham: #ffbfca;
  --wood: #c48a55; --wood-dark: #9c6a3c; --wood-light: #dba56f; --wood-line: #5e3b22;
  --gold: #ffd166; --gold-dark: #c98a1a;
  --green: #1f7a4d; --green-bright: #3ccf6e;
  --muted: #8a6a72;
  --font: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--blush); }
body {
  color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.35;
  background-color: var(--blush);
  background-image: linear-gradient(90deg, rgba(255,191,202,.55) 50%, transparent 50%), linear-gradient(rgba(255,191,202,.55) 50%, transparent 50%);
  background-size: 48px 48px;
  padding-inline: 16px; padding-block: 18px 40px;
}
.screen { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.wood { background: var(--wood); border: 3px solid var(--wood-line); box-shadow: inset 0 3px 0 var(--wood-light), inset 0 -3px 0 var(--wood-dark), 0 4px 0 rgba(74,34,54,.18); padding: 6px; image-rendering: pixelated; }
.wood > .inner { background: var(--cream); border: 2px solid var(--wood-dark); }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#logo { height: 40px; width: auto; image-rendering: pixelated; }
.sound { font: inherit; font-size: 14px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); padding: 6px 10px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.sound:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

/* stage */
.stage { position: relative; }
.stage .inner { position: relative; overflow: hidden; }
#stage { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.stage.shake { animation: shake .45s steps(6) 1; }
@keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-6px,2px)} 40%{transform:translate(5px,-3px)} 60%{transform:translate(-4px,1px)} 80%{transform:translate(3px,2px)} }

/* dialogue */
.dialog { position: relative; margin-top: 6px; }
.dialog .inner { padding: 14px 16px 12px; min-height: 92px; cursor: pointer; }
.plate { position: absolute; top: -14px; left: 14px; font-size: 15px; color: #fff; padding: 2px 10px; border: 3px solid var(--wood-line); background: var(--pink); z-index: 2; letter-spacing: .03em; }
.plate.bomb { background: #b52a3b; }
#line { margin: 4px 0 0; font-size: 19px; min-height: 2.7em; overflow-wrap: anywhere; }
#more { position: absolute; right: 18px; bottom: 10px; color: var(--pink-deep); font-size: 14px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* quest progress */
.quest { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.quest span { width: 22px; height: 10px; background: var(--paper); border: 2px solid var(--ink); }
.quest span.done { background: var(--pink); }
.quest span.now { background: var(--gold); }

/* step panels */
.panel .inner { padding: 18px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { margin: 0; font-size: 24px; font-weight: 700; text-wrap: balance; }
.panel p.hint { margin: -6px 0 0; color: var(--muted); font-size: 15px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
input[type=text], textarea { font: inherit; font-size: 19px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); padding: 10px 12px; width: 100%; border-radius: 0; outline: none; }
textarea { min-height: 120px; resize: vertical; }
input[type=text]:focus, textarea:focus { box-shadow: 0 0 0 3px var(--gold); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 19px; font-weight: 600; color: #fff; background: var(--pink); border: 3px solid var(--ink); padding: 11px 18px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--pink-deep); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.ghost { background: var(--paper); color: var(--ink); }
.btn.ghost:hover { background: var(--blush); }
.btn.wa { background: var(--green-bright); color: #0b3b22; }
.btn.wa:hover { background: #33b860; }
.btn:focus-visible, .chip:focus-visible, .star:focus-visible, .item:focus-visible, .sound:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.wide { width: 100%; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.check { display: flex; align-items: center; gap: 8px; font-size: 16px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--pink); }

/* treats */
.items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.item { font: inherit; font-size: 13px; line-height: 1.15; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); padding: 8px 4px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; box-shadow: 0 3px 0 var(--ink); }

.item[aria-pressed=true] { background: var(--blush); border-color: var(--pink-deep); box-shadow: 0 3px 0 var(--pink-deep); }
.item[aria-pressed=true]::after { content: "✓ picked"; font-size: 12px; color: var(--pink-deep); }

/* stars */
.stars { display: flex; justify-content: center; gap: 6px; }
.star { background: none; border: 0; padding: 4px; cursor: pointer; }
.star svg { width: 52px; height: 52px; display: block; shape-rendering: crispEdges; }
.star .fill { fill: #eadbcb; } .star .edge { fill: #c9b4a2; }
.star.on .fill { fill: var(--gold); } .star.on .edge { fill: var(--gold-dark); }
.star.peek { animation: wiggle .6s steps(4) infinite; }

.score { text-align: center; font-size: 16px; color: var(--muted); min-height: 1.3em; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); padding: 7px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.chip[aria-pressed=true] { background: var(--gold); }

/* review card */
.card { position: relative; background: var(--paper); border: 3px solid var(--ink); padding: 16px 16px 18px; box-shadow: 6px 6px 0 rgba(74,34,54,.2); display: flex; flex-direction: column; gap: 10px; }
.card .head { font-size: 14px; color: var(--wood-dark); text-align: center; letter-spacing: .08em; }
.card .cstars { text-align: center; font-size: 26px; letter-spacing: 3px; color: var(--gold-dark); }
.card blockquote { margin: 0; font-size: 19px; text-align: center; overflow-wrap: anywhere; }
.card .sig { text-align: right; color: var(--pink-deep); }
.card .meta { font-size: 14px; color: var(--muted); text-align: center; }
.card .icons { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.card .icons canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.stamp { position: absolute; right: 12px; bottom: 44px; color: #e5484d; border: 3px solid #e5484d; padding: 3px 8px; font-size: 15px; transform: rotate(-9deg) scale(1.8); opacity: 0; transition: transform .18s steps(3), opacity .18s steps(3); pointer-events: none; background: rgba(255,250,240,.7); }
.stamp.on { transform: rotate(-9deg) scale(1); opacity: .95; }
.copybox { font: inherit; font-size: 14px; width: 100%; min-height: 0; height: 0; padding: 0; border: 0; opacity: 0; position: absolute; }
.small { font-size: 14px; color: var(--muted); }
.num { user-select: all; font-weight: 600; color: var(--ink); }

/* pointer hint */
#point { position: absolute; z-index: 5; font-size: 22px; color: var(--pink-deep); pointer-events: none; animation: bob .7s steps(2) infinite; text-shadow: 2px 2px 0 var(--paper); transition: top .25s, left .25s; }
@keyframes bob { 50% { transform: translateY(5px); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 10; width: 100%; height: 100%; image-rendering: pixelated; }
footer { text-align: center; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .stage.shake, #point, .star.peek, #more { animation: none; } }
@media (max-width: 380px) { body { font-size: 16px; } .star svg { width: 44px; height: 44px; } }
</style>

function message() {
  const lines = [`Jadesserts review ${'⭐'.repeat(R.stars)} (${R.stars}/5)`, `From: ${firstName()}`];
