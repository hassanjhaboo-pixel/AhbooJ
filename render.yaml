services:
  - type: web
    name: anthony-james-plumbing
    runtime: node
    rootDir: anthony-james-plumbing
    buildCommand: "true"
    startCommand: node server.js
    plan: starter
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
