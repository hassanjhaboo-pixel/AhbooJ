//   A  sky:   her pieces fall through a sunset sky like silk; clouds stream past; the traced Trinidad & Tobago, extruded,
//             sit on a Gerstner-wave ocean far below. The camera plunges into a cloud.
//   B  beach: out of the cloud onto a golden-hour beach. The same pieces float down onto a clothesline over the shore and
//             flutter, backlit, while the camera tracks along the line. The drums drop as we come out of the cloud.
//   C  the wind lifts the aqua top into the lens; its colour opens into

const VS_SKY = `#version 300 es

const VS_LIT = `#version 300 es
