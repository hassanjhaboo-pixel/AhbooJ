<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SM Threads: Now Boarding</title>
<style>
  @font-face { font-family: Head; src: url("fonts/Fraunces-SuperSoft-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: Head; src: url("fonts/Fraunces-SuperSoft-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: Ui; src: url("fonts/PlusJakartaSans-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: Ui; src: url("fonts/PlusJakartaSans-Bold.ttf"); font-weight: 700; }
  html,body{margin:0;background:#000;height:100%} body{display:flex;align-items:center;justify-content:center}
  canvas{height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;display:block}
</style></head><body><canvas id="c"></canvas>
<script src="puppet.js"></script>
<script>
// SM Threads "Now Boarding" v2. 9:16. saas-animation page contract: renderAt(t), TOTAL, ready, EVENTS.
// Whole-frame movement, every shot carried into the next by a camera move or a shape:
//   cabin --(push into the seat screen, it opens to full frame)--> in-flight map --(dive into Trinidad's coast, land = wall)-->
//   peg rail --(whip tilt down)--> sand --(a wave washes over the whole frame)--> card --(the heart buckle lifts off in silver)-->
//   tan line --(circle)--> hang tag.

// ---------------- timing (one place to re-time everything) ----------------
const BPM = 117.45, BT = 60 / BPM, PH = 0.115;   // her song: shots change on its bars, the moves breathe with it rather than snap to it
const SHOT = { cabin: 0, map: PH + 10 * BT, pegs: PH + 19 * BT, sand: PH + 30 * BT, water: PH + 42 * BT, card: PH + 49 * BT, tan: PH + 57 * BT, end: PH + 63 * BT, outro: PH + 70 * BT }, END = 43.5;
const ALT = new URLSearchParams(location.search).has('alt');   // version B: match-cut transitions instead of the flip and the whip
let ENV = null; const kick = t => { if (!ENV) return 0; const f = Math.floor(t * ENV.fps); return ENV.kick[f] || 0; }, energy = t => { if (!ENV) return 0; const f = Math.floor(t * ENV.fps); return ENV.energy[f] || 0; };
const TRD = { map: 1.2, pegs: 1.3, sand: 0.9, water: 1.4, card: 0.9, tan: 1.1, end: 1.3, outro: 1.2 };   // transition into each shot
const W = 1080, H = 1920, q = new URLSearchParams(location.search), SCALE = parseFloat(q.get('scale') || '1');
const K = 1080 / 1438, OY = (1920 - 2576 * K) / 2;   // Gemini plates are 1438 x 2576

const MAG = '#CB0870', PLUM = '#2A0A1C', BLUSH = '#ECD0D5', CREAM = '#FBF6EE', WALL = '#EADFCD', SANDINK = '#6E5948';

// ---------------- helpers ----------------
const cv = document.getElementById('c'); cv.width = W * SCALE; cv.height = H * SCALE; const ctx = cv.getContext('2d');
const mk = (w = cv.width, h = cv.height) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp01 = v => Math.max(0, Math.min(1, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp01((t - a) / (b - a));
const outCubic = k => 1 - Math.pow(1 - clamp01(k), 3), inCubic = k => Math.pow(clamp01(k), 3), inOutCubic = k => { k = clamp01(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const outQuint = k => 1 - Math.pow(1 - clamp01(k), 5), inOutSine = k => -(Math.cos(Math.PI * clamp01(k)) - 1) / 2, inExpo = k => k <= 0 ? 0 : Math.pow(2, 10 * clamp01(k) - 10);
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const IMG = {}, DATA = {}; const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = () => r(); i.src = src; });
const loadJSON = (k, src) => fetch(src).then(r => r.json()).then(j => { DATA[k] = j; });
const plateSpace = c => c.setTransform(SCALE * K, 0, 0, SCALE * K, 0, SCALE * OY);
const frameSpace = c => c.setTransform(SCALE, 0, 0, SCALE, 0, 0);
function plate(c, k) { plateSpace(c); c.drawImage(IMG[k], 0, 0, 1438, 2576); }
const pp = (x, y) => [x * K, y * K + OY];
const EVENTS = []; const ev = (name, t) => EVENTS.push({ name, t: +t.toFixed(3) });
const bez = (p0, p1, p2, p3, n = 80) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]; });
const heartPts = (x, y, s, n = 120) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n * TAU; return [x + s * Math.pow(Math.sin(t), 3), y - s * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16]; });
const pathPts = (c, pts) => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };

// words fade up from blurred to sharp with a small rise (frame space)
function words(c, str, lt, t0, o = {}) {
  const { x = W / 2, y = 200, size = 84, col = PLUM, weight = 600, face = 'Head', track = -0.02, stagger = 0.09, dur = 0.75, out = null, shadow = null } = o;
  frameSpace(c); c.save(); c.font = `${weight} ${size}px ${face}, sans-serif`; c.letterSpacing = (size * track) + 'px';
  const ws = str.split(' '), sp = c.measureText(' ').width, wd = ws.map(w => c.measureText(w).width), tot = wd.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let px = x - tot / 2;
  ws.forEach((w, i) => { const a = outCubic(prog(lt, t0 + i * stagger, t0 + i * stagger + dur)), b = out == null ? 0 : inOutSine(prog(lt, out + i * stagger * 0.5, out + i * stagger * 0.5 + 0.5)), v = a * (1 - b);
    if (v > 0.003) { c.save(); c.globalAlpha = v; c.filter = `blur(${((1 - a) * 14 + b * 10) * SCALE}px)`; if (shadow) { c.shadowColor = shadow; c.shadowBlur = 18 * SCALE; c.shadowOffsetY = 3 * SCALE; }
      c.fillStyle = col; c.fillText(w, px, y + (1 - a) * size * 0.32 - b * size * 0.2); c.restore(); } px += wd[i] + sp; });
  c.restore();
}

// ---------------- image -> any four-corner quad (perspective-correct to the eye: a fine triangle grid) ----------------
function warp(c, src, sx, sy, sw, sh, quad, n = 10) {   // quad: [tl, tr, br, bl] in c's current space
  const P = (u, v) => { const [a, b, cc, d] = quad; const top = [lerp(a[0], b[0], u), lerp(a[1], b[1], u)], bot = [lerp(d[0], cc[0], u), lerp(d[1], cc[1], u)]; return [lerp(top[0], bot[0], v), lerp(top[1], bot[1], v)]; };
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const u0 = i / n, u1 = (i + 1) / n, v0 = j / n, v1 = (j + 1) / n;
    tri(c, src, [sx + u0 * sw, sy + v0 * sh], [sx + u1 * sw, sy + v0 * sh], [sx + u0 * sw, sy + v1 * sh], P(u0, v0), P(u1, v0), P(u0, v1));
    tri(c, src, [sx + u1 * sw, sy + v0 * sh], [sx + u1 * sw, sy + v1 * sh], [sx + u0 * sw, sy + v1 * sh], P(u1, v0), P(u1, v1), P(u0, v1));
  }
}
function tri(c, img, s0, s1, s2, d0, d1, d2) {
  const ex = (p, cx, cy) => { const dx = p[0] - cx, dy = p[1] - cy, l = Math.hypot(dx, dy) || 1; return [p[0] + dx / l * 0.9, p[1] + dy / l * 0.9]; };   // grow 0.9px so seams never show
  const cx = (d0[0] + d1[0] + d2[0]) / 3, cy = (d0[1] + d1[1] + d2[1]) / 3;
  c.save(); c.beginPath(); const e0 = ex(d0, cx, cy), e1 = ex(d1, cx, cy), e2 = ex(d2, cx, cy); c.moveTo(...e0); c.lineTo(...e1); c.lineTo(...e2); c.closePath(); c.clip();
  const [sx0, sy0] = s0, [sx1, sy1] = s1, [sx2, sy2] = s2, [x0, y0] = d0, [x1, y1] = d1, [x2, y2] = d2;
  const den = sx0 * sy1 + sy0 * sx2 + sx1 * sy2 - sy1 * sx2 - sy0 * sx1 - sx0 * sy2; if (Math.abs(den) < 1e-9) { c.restore(); return; }
  const a = (x0 * sy1 + sy0 * x2 + x1 * sy2 - sy1 * x2 - sy0 * x1 - x0 * sy2) / den, cc = (sx0 * x1 + x0 * sx2 + sx1 * x2 - x1 * sx2 - x0 * sx1 - sx0 * x2) / den;
  const e = (sx0 * sy1 * x2 + sy0 * x1 * sx2 + x0 * sx1 * sy2 - x0 * sy1 * sx2 - sy0 * sx1 * x2 - sx0 * x1 * sy2) / den;
  const b = (y0 * sy1 + sy0 * y2 + y1 * sy2 - sy1 * y2 - sy0 * y1 - y0 * sy2) / den, d = (sx0 * y1 + y0 * sx2 + sx1 * y2 - y1 * sx2 - y0 * sx1 - sx0 * y2) / den;
  const f = (sx0 * sy1 * y2 + sy0 * y1 * sx2 + y0 * sx1 * sy2 - y0 * sy1 * sx2 - sy0 * sx1 * y2 - sx0 * y1 * sy2) / den;
  c.transform(a, b, cc, d, e, f); c.drawImage(img, 0, 0); c.restore();
}

// ---------------- the in-flight map (one function for the seat screen and the full frame, driven by absolute time) ----------------
const MAPC = mk(1080, 1920);
let PIARCO, AROUCA, CROWN, DIVE;   // traced-map coords, set from the real lon/lat once the outline loads
let MAPPIN = [540, 960], MAPPIN_R = 10;   // where the Arouca pin sits in the full-frame map (for the pin transition)
const PLANE = (c, x, y, ang, ps) => { c.save(); c.translate(x, y); c.rotate(ang + Math.PI / 2); c.scale(ps / 20, ps / 20); c.shadowColor = 'rgba(42,10,28,0.25)'; c.shadowBlur = 8; c.shadowOffsetY = 4; c.fillStyle = PLUM; c.beginPath();
  c.moveTo(0, -20); c.bezierCurveTo(2.2, -18, 2.4, -12, 2.4, -6); c.lineTo(19, 3); c.lineTo(19, 6.5); c.lineTo(2.4, 2.5); c.lineTo(2.2, 12); c.lineTo(7, 16.5); c.lineTo(7, 19); c.lineTo(0, 17); c.lineTo(-7, 19); c.lineTo(-7, 16.5); c.lineTo(-2.2, 12); c.lineTo(-2.4, 2.5); c.lineTo(-19, 6.5); c.lineTo(-19, 3); c.lineTo(-2.4, -6); c.bezierCurveTo(-2.4, -12, -2.2, -18, 0, -20); c.fill(); c.restore(); };
const CAR = (c, x, y, ang, sz) => { c.save(); c.translate(x, y); c.rotate(ang); c.shadowColor = 'rgba(42,10,28,0.25)'; c.shadowBlur = 5; c.shadowOffsetY = 2; c.fillStyle = PLUM; c.beginPath(); c.roundRect(-sz, -sz * 0.5, sz * 2, sz, sz * 0.32); c.fill(); c.shadowColor = 'transparent';
  c.fillStyle = 'rgba(255,240,245,0.85)'; c.beginPath(); c.roundRect(sz * 0.25, -sz * 0.36, sz * 0.42, sz * 0.72, sz * 0.12); c.fill(); c.restore(); };
const TOWNS_ORDER = ['Arima', 'Port of Spain', 'Chaguanas', 'Sangre Grande', 'Diego Martin', 'Couva', 'San Fernando', 'Toco', 'Princes Town', 'Rio Claro', 'Mayaro', 'Point Fortin', 'Siparia'];
function drawMap(T, w, h) {   // the seat-screen and full-frame map: deliveries leaving her studio in Arouca for the whole country
  const c = MAPC.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h);
  const [ax, ay] = DATA.tt.aspect, port = h > w, TW = DATA.tt.towns;
  const s0 = Math.min(w * 0.86 / ax, h * (port ? 0.52 : 0.76) / ay);
  const push = inOutSine(prog(T, SHOT.map - 0.2, SHOT.pegs + TRD.pegs)), Z = 1 + push * 1.25 + inCubic(prog(T, SHOT.pegs - 1.2, SHOT.pegs + TRD.pegs)) * 0.9;   // one continuous push in, as the deliveries spread
  const fx = lerp(ax / 2, AROUCA[0], push), fy = lerp(ay / 2, AROUCA[1], push), s = s0 * Z, cxp = w / 2, cyp = h * (port ? 0.54 : 0.5);
  const M = ([u, v]) => [cxp + (u - fx) * s, cyp + (v - fy) * s];
  c.fillStyle = '#F7E4E8'; c.fillRect(0, 0, w, h);
  c.save(); c.strokeStyle = 'rgba(203,8,112,0.07)'; c.lineWidth = 1.5; for (let g = -2; g <= 3; g += 0.25) { const [x0, y0] = M([g, -2]), [x1, y1] = M([g, 3]); c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); const [a0, b0] = M([-2, g]), [a1, b1] = M([3, g]); c.beginPath(); c.moveTo(a0, b0); c.lineTo(a1, b1); c.stroke(); } c.restore();
  DATA.tt.islands.forEach(isl => { const pts = isl.pts.map(M); c.save(); c.shadowColor = 'rgba(160,60,90,0.18)'; c.shadowBlur = 18; c.shadowOffsetY = 6; pathPts(c, pts); c.fillStyle = WALL; c.fill(); c.restore();
    pathPts(c, pts); c.lineWidth = Math.max(2, Math.min(4, 2.2 * Math.sqrt(Z))); c.strokeStyle = MAG; c.lineJoin = 'round'; c.stroke(); });
  const la = outCubic(prog(T, 1.2, 2.0)); if (la > 0) { c.save(); c.globalAlpha = la * 0.75; c.fillStyle = PLUM; c.font = `500 ${Math.round(s0 * 0.036)}px Ui, sans-serif`; c.textAlign = 'center'; c.letterSpacing = `${s0 * 0.006}px`;
    const [tx, ty] = M([0.45, 0.62]); c.fillText('TRINIDAD', tx, ty); const [bx, by] = M([0.87, 0.165]); c.fillText('TOBAGO', bx, by); c.restore(); }
  const A = M(AROUCA), lw = Math.max(2.5, s0 * 0.0055);
  // deliveries: a route draws out of Arouca to each town, a little car rides its tip, the town pin pops when it arrives
  TOWNS_ORDER.forEach((name, i) => { const t0 = SHOT.map + 0.15 + i * BT * 0.42, k = inOutSine(prog(T, t0, t0 + 1.4)); if (k <= 0) return;
    const B = TW[name], mx = (AROUCA[0] + B[0]) / 2, my = (AROUCA[1] + B[1]) / 2, dx = B[0] - AROUCA[0], dy = B[1] - AROUCA[1], bend = (i % 2 ? 1 : -1) * 0.22;
    const pts = bez(AROUCA, [mx - dy * bend, my + dx * bend], [mx - dy * bend * 0.6, my + dx * bend * 0.6], B, 50).map(M), n = Math.max(1, Math.floor(k * (pts.length - 1)));
    c.save(); c.lineCap = 'round'; c.strokeStyle = 'rgba(203,8,112,0.85)'; c.lineWidth = lw; c.beginPath(); for (let j = 0; j <= n; j++) j ? c.lineTo(...pts[j]) : c.moveTo(...pts[j]); c.stroke(); c.restore();
    if (k < 1) { const j = Math.min(pts.length - 2, n); CAR(c, pts[j][0], pts[j][1], Math.atan2(pts[j + 1][1] - pts[j][1], pts[j + 1][0] - pts[j][0]), s0 * 0.013); }
    const arr = prog(T, t0 + 1.4, t0 + 1.8); if (arr > 0) { const [px, py] = M(B), pop = arr < 1 ? 1 + Math.sin(arr * Math.PI) * 0.5 : 1; if (arr < 1) { c.beginPath(); c.arc(px, py, s0 * (0.012 + arr * 0.04), 0, TAU); c.strokeStyle = `rgba(203,8,112,${0.5 * (1 - arr)})`; c.lineWidth = 2.5; c.stroke(); }
      c.beginPath(); c.arc(px, py, s0 * 0.0095 * pop, 0, TAU); c.fillStyle = MAG; c.fill(); c.beginPath(); c.arc(px, py, s0 * 0.004 * pop, 0, TAU); c.fillStyle = CREAM; c.fill(); } });
  // and a plane over to Tobago
  const pr = inOutSine(prog(T, SHOT.map + 0.5, SHOT.map + 3.4)); if (pr > 0) { const B = TW['Scarborough'], route = bez(PIARCO, [PIARCO[0] + 0.1, PIARCO[1] - 0.28], [B[0] - 0.2, B[1] - 0.1], B, 90).map(M), n = Math.max(1, Math.floor(pr * (route.length - 1)));
    c.save(); c.lineCap = 'round'; c.strokeStyle = 'rgba(203,8,112,0.85)'; c.lineWidth = lw; c.setLineDash([lw * 3, lw * 2.4]); c.beginPath(); for (let j = 0; j <= n; j++) j ? c.lineTo(...route[j]) : c.moveTo(...route[j]); c.stroke(); c.restore();
    if (pr < 1) { const j = Math.min(route.length - 2, n); PLANE(c, route[j][0], route[j][1], Math.atan2(route[j + 1][1] - route[j][1], route[j + 1][0] - route[j][0]), s0 * 0.04); }
    else { const [px, py] = M(B); c.beginPath(); c.arc(px, py, s0 * 0.0095, 0, TAU); c.fillStyle = MAG; c.fill(); c.beginPath(); c.arc(px, py, s0 * 0.004, 0, TAU); c.fillStyle = CREAM; c.fill(); } }
  // her studio: the bigger pin everything leaves from
  const ar = outCubic(prog(T, 0.9, 1.5)); if (ar > 0) { c.save(); c.globalAlpha = ar; const pr2 = s0 * 0.017 * (1 + 0.12 * kick(T));
    for (let k = 0; k < 2; k++) { const ph = (T * 0.7 + k * 0.5) % 1; c.beginPath(); c.arc(A[0], A[1], pr2 + ph * s0 * 0.05, 0, TAU); c.strokeStyle = `rgba(203,8,112,${0.45 * (1 - ph)})`; c.lineWidth = 3; c.stroke(); }
    c.beginPath(); c.arc(A[0], A[1], pr2, 0, TAU); c.fillStyle = MAG; c.fill(); c.beginPath(); c.arc(A[0], A[1], pr2 * 0.42, 0, TAU); c.fillStyle = CREAM; c.fill();
    c.font = `500 ${Math.round(s0 * 0.032)}px Ui, sans-serif`; c.fillStyle = PLUM; c.textAlign = 'right'; c.fillText('SM Threads, Arouca', A[0] - s0 * 0.035, A[1] - s0 * 0.028); c.restore(); MAPPIN = A; MAPPIN_R = pr2; }
  const hb = 1 - prog(T, SHOT.map + 2.2, SHOT.map + 2.8); if (hb > 0.01) { c.save(); c.globalAlpha = hb; const fs = Math.round(Math.min(w, h * 1.6) * 0.032); c.font = `500 ${fs}px Ui, sans-serif`; c.fillStyle = PLUM;
    c.textAlign = 'left'; c.fillText('Delivering islandwide', w * 0.06, h * (port ? 0.93 : 0.92)); c.textAlign = 'right'; c.fillText('SM Threads', w * 0.94, h * (port ? 0.93 : 0.92)); c.restore(); }
}

// ---------------- cabin screens ----------------
const PIECES = ['sand-purple', 'sand-red', 'sand-orange', 'peg-top'], PSIZE = { 'sand-purple': [615, 732], 'sand-red': [608, 582], 'sand-orange': [557, 762], 'peg-top': [475, 1257] };
const TILE = {}; function tile(k) {   // a piece on the screen's white UI, as a texture
  if (TILE[k]) return TILE[k]; const c = mk(640, 400), x = c.getContext('2d'), [w, h] = PSIZE[k], s = Math.min(640 * 0.74 / w, 400 * 0.82 / h);
  x.fillStyle = '#F6F3F1'; x.fillRect(0, 0, 640, 400); x.drawImage(IMG[k], 320 - w * s / 2, 200 - h * s / 2, w * s, h * s); return TILE[k] = c; }
const SCRN = mk(), SCRX = SCRN.getContext('2d'), SLIDE = mk(640, 400);
function screens(c, lt) {
  const Q = DATA.quads, keys = Object.keys(Q).filter(k => k !== 'front');
  SCRX.setTransform(1, 0, 0, 1, 0, 0); SCRX.globalCompositeOperation = 'source-over'; SCRX.clearRect(0, 0, SCRN.width, SCRN.height); plateSpace(SCRX);
  keys.forEach((k, i) => { const on = BT + i * BT / 2; if (lt < on) return;
    const per = 4 * BT, ph = (lt - on) / per, n = Math.floor(ph), u = inOutCubic(prog(ph - n, 0.78, 1)), a0 = PIECES[(i + n) % 4], a1 = PIECES[(i + n + 1) % 4];   // each screen glides to the next piece every bar
    const T2 = SLIDE.getContext('2d'); T2.setTransform(1, 0, 0, 1, 0, 0); T2.drawImage(tile(a0), -u * 640, 0); T2.drawImage(tile(a1), (1 - u) * 640, 0); warp(SCRX, SLIDE, 0, 0, 640, 400, Q[k], 6);
    const dk = 1 - outCubic(prog(lt, on, on + 0.45)); if (dk > 0) { SCRX.save(); SCRX.globalAlpha = dk; SCRX.fillStyle = '#1C1F24'; pathPts(SCRX, Q[k]); SCRX.fill(); SCRX.restore(); } });
  if (lt > 0.9) { const [x0, y0, x1, y1] = [0, 0, 960, 540]; drawMap(lt + SHOT.cabin, 960, 540); warp(SCRX, MAPC, 0, 0, 960, 540, Q.front, 14); }
  // glass: a soft diagonal sheen across every screen
  SCRX.save(); SCRX.globalCompositeOperation = 'source-atop'; const g = SCRX.createLinearGradient(0, 400, 1438, 1900); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.48, 'rgba(255,255,255,0.10)'); g.addColorStop(0.52, 'rgba(255,255,255,0.0)'); SCRX.fillStyle = g; SCRX.fillRect(0, 0, 1438, 2576); SCRX.restore();
  // only where the real screen is visible (heads and seats stay in front)
  SCRX.save(); SCRX.globalCompositeOperation = 'destination-in'; SCRX.drawImage(IMG.mask, 0, 0, 1438, 2576); SCRX.restore();
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(SCRN, 0, 0); c.restore();
}

// ---------------- peg rail: puppet cloth, cut in on the beat with its shadow already on the wall ----------------
const CUT = { 'peg-top': [173, 835, 648, 2092], 'peg-bottom': [669, 846, 1038, 1601], 'peg-skirt': [984, 797, 1365, 1981] };
const PEG = { 'peg-top': [403, 846], 'peg-bottom': [814, 852], 'peg-skirt': [1219, 806] };
const PUP = {}, TMP = mk(), SHD = mk(), TANL = mk(); const SWIM_N = 144; let LIFT = 0; const SANDL = {}, SANDL2 = {}, PEGL = {}; const TANLOGO = document.createElement('canvas');
